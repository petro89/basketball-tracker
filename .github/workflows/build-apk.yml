name: Build Basketball Tracker APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize pushes so multiple builds do not try to replace the same release asset at once.
concurrency:
  group: basketball-tracker-apk-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate tracker JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          const inlineScripts = scripts.filter(([, attrs, body]) => !/\bsrc\s*=/.test(attrs) && body.trim());
          if (!inlineScripts.length) throw new Error('No inline JavaScript found in index.html');
          for (let i = 0; i < inlineScripts.length; i++) {
            try {
              new Function(inlineScripts[i][2]);
            } catch (error) {
              console.error('index.html inline script ' + (i + 1) + ': ' + error.message);
              process.exit(1);
            }
          }
          console.log('index.html: ' + inlineScripts.length + ' inline script(s) passed syntax validation');
          NODE

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: basketball-tracker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest testing APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-apk-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit android-apk-latest               --repo "$GITHUB_REPOSITORY"               --title "Basketball Tracker APK — latest test build"               --notes "Installable Android test build of Basketball Tracker. Internet is currently required to load the tracker and its AI libraries. Debug-signed for testing; not a final Google Play release."
          else
            gh release create android-apk-latest               app/build/outputs/apk/debug/app-debug.apk               --repo "$GITHUB_REPOSITORY"               --target main               --prerelease               --title "Basketball Tracker APK — latest test build"               --notes "Installable Android test build of Basketball Tracker. Internet is currently required to load the tracker and its AI libraries. Debug-signed for testing; not a final Google Play release."
          fi
          gh release upload android-apk-latest app/build/outputs/apk/debug/app-debug.apk             --repo "$GITHUB_REPOSITORY"             --clobber
